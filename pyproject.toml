[project]
name = "gba-laboratory-api"
version = "0.1.0"
description = "Laboratory samples and results integration API"
readme = "README.md"
requires-python = ">=3.14"
dependencies = [
    "django>=5.2,<5.3",
    "django-filter>=25.1,<26",
    "djangorestframework>=3.17,<3.18",
    "djangorestframework-simplejwt>=5.5,<6",
    "drf-spectacular>=0.28,<1",
    "factory-boy>=3.3,<4",
    "gunicorn>=26.1,<27",
    "psycopg[binary,pool]>=3.2,<4",
    "python-json-logger>=3.3,<4",
]

[dependency-groups]
dev = [
    "ruff>=0.12,<1",
]

[tool.ruff]
line-length = 100
target-version = "py314"

[tool.ruff.lint]
select = ["E", "F", "I", "UP"]
